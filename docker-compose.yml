services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/crypto_spot_collector/apps/secrets.json:/app/crypto_spot_collector/apps/secrets.json:ro
      - ./logs:/app/crypto_spot_collector/apps/logs
    # command: sleep infinity
    command: uv run crypto_spot_collector/apps/buy_spot.py
    depends_on:
      - mysql
    networks:
      - crypto-network
    environment:
      - DATABASE_URL=mysql://crypto_user:crypto_pass@mysql:3306/crypto_pachinko

  app_perp:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./logs:/app/crypto_spot_collector/apps/logs
      - ./backups:/backups
      - hyperliquid-perp-state:/var/lib/crypto-spot-collector
    secrets:
      - source: hyperliquid_perp_credentials
        target: hyperliquid_credentials.json
      - source: hyperliquid_perp_settings
        target: hyperliquid_settings.json
    command: uv run crypto_spot_collector/apps/buy_perp.py
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      - mysql
    networks:
      - crypto-network
    environment:
      - DATABASE_URL=mysql://crypto_user:crypto_pass@mysql:3306/crypto_pachinko
      - HYPERLIQUID_SECRETS_FILE=/run/secrets/hyperliquid_credentials.json
      - HYPERLIQUID_SETTINGS_FILE=/run/secrets/hyperliquid_settings.json
      - HYPERLIQUID_STATE_DIR=/var/lib/crypto-spot-collector
      - HYPERLIQUID_DEPLOYMENT_NETWORK=${HYPERLIQUID_DEPLOYMENT_NETWORK:?set testnet or mainnet}
      - HYPERLIQUID_MAINNET_CONFIRMATION=${HYPERLIQUID_MAINNET_CONFIRMATION:-}
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -m
        - crypto_spot_collector.scripts.healthcheck
        - --state-dir
        - /var/lib/crypto-spot-collector
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app_portfolio_testnet:
    profiles: ["portfolio-testnet"]
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./logs:/app/crypto_spot_collector/apps/logs
      - ./backups:/backups
      - hyperliquid-perp-state:/var/lib/crypto-spot-collector
    secrets:
      - source: hyperliquid_perp_credentials
        target: hyperliquid_credentials.json
      - source: hyperliquid_perp_settings
        target: hyperliquid_settings.json
    command: uv run python -m crypto_spot_collector.apps.buy_portfolio
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - crypto-network
    environment:
      - HYPERLIQUID_SECRETS_FILE=/run/secrets/hyperliquid_credentials.json
      - HYPERLIQUID_SETTINGS_FILE=/run/secrets/hyperliquid_settings.json
      - HYPERLIQUID_STATE_DIR=/var/lib/crypto-spot-collector
      - HYPERLIQUID_DEPLOYMENT_NETWORK=testnet
      - HYPERLIQUID_MAINNET_CONFIRMATION=
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -m
        - crypto_spot_collector.scripts.healthcheck
        - --state-dir
        - /var/lib/crypto-spot-collector
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app_portfolio_mainnet_disabled:
    profiles: ["portfolio-mainnet-disabled"]
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./logs:/app/crypto_spot_collector/apps/logs
      - ./backups:/backups
      - hyperliquid-perp-state:/var/lib/crypto-spot-collector
    secrets:
      - source: hyperliquid_perp_credentials
        target: hyperliquid_credentials.json
      - source: hyperliquid_perp_settings
        target: hyperliquid_settings.json
    command: uv run python -m crypto_spot_collector.apps.buy_portfolio
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - crypto-network
    environment:
      - HYPERLIQUID_SECRETS_FILE=/run/secrets/hyperliquid_credentials.json
      - HYPERLIQUID_SETTINGS_FILE=/run/secrets/hyperliquid_settings.json
      - HYPERLIQUID_STATE_DIR=/var/lib/crypto-spot-collector
      - HYPERLIQUID_DEPLOYMENT_NETWORK=mainnet
      - HYPERLIQUID_MAINNET_CONFIRMATION=${HYPERLIQUID_MAINNET_CONFIRMATION:?explicit mainnet confirmation is required}
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -m
        - crypto_spot_collector.scripts.healthcheck
        - --state-dir
        - /var/lib/crypto-spot-collector
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/crypto_spot_collector/apps/secrets.json:/app/crypto_spot_collector/apps/secrets.json:ro
      - ./logs:/app/crypto_spot_collector/apps/logs
    # command: sleep infinity
    command: uv run crypto_spot_collector/apps/discord_appliation.py
    depends_on:
      - mysql
    networks:
      - crypto-network
    environment:
      - DATABASE_URL=mysql://crypto_user:crypto_pass@mysql:3306/crypto_pachinko

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - crypto-network
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=crypto_pachinko
      - MYSQL_USER=crypto_user
      - MYSQL_PASSWORD=crypto_pass
    ports:
      - "3306:3306"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "9001:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=debug # 表示するログレベル (debug, info, warn, error)

volumes:
  mysql-data:
  portainer_data:
  hyperliquid-perp-state:

secrets:
  hyperliquid_perp_credentials:
    file: ${HYPERLIQUID_PERP_SECRETS_FILE:?set an environment-specific credential file}
  hyperliquid_perp_settings:
    file: ${HYPERLIQUID_PERP_SETTINGS_FILE:?set an environment-specific settings file}

networks:
  crypto-network:
    driver: bridge
